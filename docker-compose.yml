# Real services for the integration tests: `bun run services && bun run test:services`
# Postgres, Redis, and an Upstash-compatible REST proxy in front of Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: pw, POSTGRES_DB: stats }
    ports: ["55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 30 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
  upstash:
    image: hiett/serverless-redis-http:latest
    environment: { SRH_MODE: env, SRH_TOKEN: tok, SRH_CONNECTION_STRING: "redis://redis:6379" }
    ports: ["58079:80"]
    depends_on: { redis: { condition: service_healthy } }
