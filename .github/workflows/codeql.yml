name: codeql

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "examples/**/*.ts"
      - "examples/**/*.tsx"
      - "examples/**/*.js"
      - "examples/**/*.jsx"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "examples/**/*.ts"
      - "examples/**/*.tsx"
      - "examples/**/*.js"
      - "examples/**/*.jsx"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
