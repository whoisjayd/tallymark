name: release

# Publish to npm when you push a version tag:
#   npm version patch   (or minor / major)   # bumps package.json and creates the tag
#   git push --follow-tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)"; exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run smoke

      - name: Publish to npm (with provenance)
        run: |
          npm install -g npm@11
          # setup-node writes an _authToken line. A token, even an empty one,
          # makes npm skip the trusted publisher and use the old credential.
          if [ -f "$HOME/.npmrc" ]; then
            grep -v '_authToken' "$HOME/.npmrc" > "$HOME/.npmrc.tmp"
            mv "$HOME/.npmrc.tmp" "$HOME/.npmrc"
          fi
          npm publish --provenance --access public

      # The tracker is the string inside dist/script.js. There is no separate file to attach.
      - name: GitHub release (auto-generated notes)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  docker:
    name: publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
